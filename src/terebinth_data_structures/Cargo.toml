[package]
name = "terebinth_data_structures"
version = "0.0.0"
edition = "2024"

[dependencies]
arrayvec = { version = "0.7", default-features = false }
bitflags = "2.4.1"
either = "1.0"
elsa = "1.11.0"
ena = "0.14.3"
indexmap = "2.4.0"
jobserver_crate = { version = "0.1.28", package = "jobserver" }
measureme = "12.0.1"
rustc-hash = "2.0.0"
rustc-rayon = { version = "0.5.1", features = ["indexmap"] }
rustc-stable-hash = { version = "0.1.0", features = ["nightly"] }
terebinth_arena_allocator = { path = "../terebinth_arena_allocator" }
terebinth_hashes = { path = "../terebinth_hashes" }
terebinth_index = { path = "../terebinth_index" }
terebinth_macros = { path = "../terebinth_macros" }
terebinth_serialize = { path = "../terebinth_serialize" }
smallvec = { version = "1.8.1", features = ["const_generics", "union", "may_dangle"] }
stacker = "0.1.17"
tempfile = "3.2"
thin-vec = "0.2.12"
tracing = "0.1"

[dependencies.hashbrown]
version = "0.15.2"
default-features = false
features = ["nightly"]

[dependencies.parking_lot]
version = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.2.1"

[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = "1.5.1"